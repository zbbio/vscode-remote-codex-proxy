name: Validate plugin

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  repository:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - name: Validate plugin structure and eval dataset
        run: python tests/validate_repository.py
      - name: Parse Bash scripts
        run: bash -n skills/vscode-remote-codex-proxy/scripts/*.sh tests/*.sh
      - name: Lint Bash scripts
        run: shellcheck skills/vscode-remote-codex-proxy/scripts/*.sh tests/*.sh
      - name: Test remote diagnostics
        run: bash tests/inspect-remote-fixture.sh
      - name: Test wrapper lifecycle
        run: bash tests/repair-wrapper-fixture.sh

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Parse and test PowerShell diagnostic
        shell: powershell
        run: .\tests\Inspect-CodexProxy.Tests.ps1
